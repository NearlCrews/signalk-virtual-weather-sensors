version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The package advertises a Node 20.18 runtime floor for Cerbo GX and
      # similar installs, and scripts/check-package.mjs holds the types major
      # to that floor so type-checking cannot promise a newer Node API than
      # the package supports. Patches inside major 20 still arrive.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The shared UI ships breaking changes in 0.x minors and is pinned
      # exactly, so its bump arrives alone with the migration guide open.
      shared-ui:
        patterns: ["signalk-nearlcrews-ui"]
      dev-deps:
        dependency-type: "development"
        exclude-patterns: ["signalk-nearlcrews-ui"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze must run at the same version inside one workflow run,
      # and dependabot treats the two paths as separate dependencies. Split
      # bumps fail with "Loaded a configuration file for version X, but running
      # version Y" on every codeql-action release.
      codeql:
        patterns: ["github/codeql-action*"]
