name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx --yes npm@12.0.2 run verify:release
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  node-20-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.0
          package-manager-cache: false
      # npm 12 starts at Node 22.22.2. Use the newest npm 11 release in this
      # runtime-floor lane so Node 20.18 is exercised by a supported npm.
      - run: npx --yes npm@11.19.0 ci
      - run: npx --yes npm@11.19.0 run type-check
      # Vitest runs on the exact 20.18 floor even though Vite and Rolldown
      # advertise a 20.19 engine range, so the unit suite belongs in this lane.
      # The upstream armv7 lane runs the suite on node:20-bookworm-slim, which
      # tracks the latest Node 20 rather than the version this package
      # advertises, and it is advisory besides.
      - run: npx --yes npm@11.19.0 run test
      - run: npx --yes npm@11.19.0 run build
