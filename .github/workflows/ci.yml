name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # `verify` plus the cross-browser matrix, deliberately NOT
      # `verify:release`. That chain ends with `audit:full`, an audit of the
      # whole development tree, and the advisory database is an external input
      # that changes without a commit: one new devDependency advisory turned
      # every open pull request red for reasons none of them introduced. The
      # runtime audit users are actually exposed to (`audit:runtime`) still runs
      # inside `verify` here, `audit:full` still gates the release through
      # `prepublishOnly`, and the scheduled job in workflow-security.yml
      # surfaces a new development advisory on its own.
      - run: npx --yes npm@12.0.2 run verify
      - run: npx --yes npm@12.0.2 run test:browser:cross:built
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  node-20-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This lane proves the PLUGIN RUNTIME on the floor engines.node advertises,
    # not the test toolchain. A Signal K plugin runs inside the server process
    # and signalk-server declares node >=22, so no supported installation ever
    # executes this plugin on Node 20. What the floor still promises is that
    # the plugin's own compiled code installs, type-checks, builds, and loads
    # there, which is what the steps below check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.0
          package-manager-cache: false
      # npm 12 starts at Node 22.22.2. Use the newest npm 11 release in this
      # runtime-floor lane so Node 20.18 is exercised by a supported npm.
      - run: npx --yes npm@11.19.0 ci
      - run: npx --yes npm@11.19.0 run type-check
      - run: npx --yes npm@11.19.0 run boundaries
      - run: npx --yes npm@11.19.0 run build
      # Turns "it compiled" into "it loads and constructs" on the runtime
      # floor: imports the built bundle, builds the plugin object, and checks
      # the surface signalk-server calls into, including the schema() fallback.
      - run: npx --yes npm@11.19.0 run check:runtime
      # The unit suite is skipped here, by design and out loud. Vitest 5
      # declares node ^22.12.0 || ^24.0.0 || >=26.0.0, so
      # scripts/run-unit-tests.mjs prints a notice naming that floor and exits
      # 0 instead of crashing inside the runner. The predicate it consults
      # lives in scripts/unit-test-toolchain.mjs with the floors written out,
      # and scripts/test-unit-test-toolchain.mjs pins them at their
      # boundaries. Running it here proves the guard reports rather than
      # fails; the suite itself runs in the verify lane on Node 24.
      - run: npx --yes npm@11.19.0 test
