name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx --yes npm@12.0.2 run verify:release
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  node-20-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.0
          package-manager-cache: false
      # npm 12 starts at Node 22.22.2. Use the newest npm 11 release in this
      # runtime-floor lane so Node 20.18 is exercised by a supported npm.
      - run: npx --yes npm@11.19.0 ci
      - run: npx --yes npm@11.19.0 run type-check
      # The unit suite deliberately does not run here. Rolldown and the oxc
      # parser ship their native bindings as OPTIONAL dependencies gated on
      # ^20.19.0 || >=22.12.0, and npm skips an optional dependency whose
      # engines it cannot satisfy, so a fresh install on 20.18 omits the two
      # binding packages a Node 24 install resolves. Vitest then dies at
      # startup with "Cannot find native binding" out of Rolldown. Vitest is
      # blameless here: its own engines admit ^20.0.0, and running the suite
      # against a tree installed under a newer Node hides the fault entirely,
      # because only the install is version-sensitive. The suite runs in the
      # verify lane on Node 24, so this stays a type-check and build lane on
      # the exact runtime floor the package advertises.
      - run: npx --yes npm@11.19.0 run build
