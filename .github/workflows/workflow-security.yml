name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          online-audits: false

  dependency-audit:
    # The full development-tree audit lives here rather than in the CI verify
    # lane. The advisory database changes without a commit, so gating every
    # pull request on it turned unrelated work red; on a schedule it still
    # surfaces a new development advisory within a week, and the release path
    # still runs it through `verify:release`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npx --yes npm@12.0.2 ci
      - name: Audit runtime dependencies
        run: npx --yes npm@12.0.2 run audit:runtime
      - name: Audit the full development tree
        run: npx --yes npm@12.0.2 run audit:full
