<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Weather Sensors panel fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f0f3f5;
        color: #23282c;
        font-family: Arial, sans-serif;
      }

      .app {
        min-height: 100vh;
      }

      .app-header {
        height: 55px;
        padding: 0 1rem;
        border-bottom: 1px solid #c8ced3;
        background: #fff;
        color: #1b1e21;
        font-weight: 700;
        line-height: 55px;
      }

      .app-body {
        display: flex;
        min-height: calc(100vh - 55px);
        overflow-x: hidden;
      }

      .sidebar {
        flex: 0 0 200px;
        padding: 1rem;
        background: #2f353a;
        color: #f3f4f5;
      }

      .sidebar p {
        margin: 0 0 0.75rem;
      }

      main.main {
        min-width: 0;
        flex: 1;
        padding: 1.5rem;
      }

      .page-title {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }

      .row {
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
      }

      .plugin-list,
      .config-column {
        min-width: 0;
        flex: 1 1 0;
      }

      .card {
        border: 1px solid #c8ced3;
        border-radius: 0.25rem;
        background: #fff;
      }

      .card-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #c8ced3;
        font-weight: 600;
      }

      .card-body {
        padding: 1rem;
      }

      .plugin-list button {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0.65rem 0.75rem;
        border: 0;
        border-bottom: 1px solid #d8dbe0;
        background: #fff;
        color: inherit;
        text-align: left;
      }

      .plugin-list button[aria-current="true"] {
        border-left: 4px solid #20a8d8;
        background: #e7f5fa;
        font-weight: 600;
      }

      @media (max-width: 767px) {
        .sidebar,
        .plugin-list {
          display: none;
        }

        main.main {
          padding: 0;
        }

        .row {
          display: block;
        }

        .card {
          border-inline: 0;
          border-radius: 0;
        }

        .card-body {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">Signal K Server</header>
      <div class="app-body">
        <aside class="sidebar" aria-label="Admin navigation">
          <p>Dashboard</p>
          <p>Server</p>
          <p>Apps and Plugins</p>
        </aside>
        <main class="main">
          <h1 class="page-title">Plugin Config</h1>
          <div class="row">
            <section class="plugin-list card" aria-label="Installed plugins">
              <div class="card-header">Plugins</div>
              <button type="button">Synthetic Values</button>
              <button type="button" aria-current="true">Virtual Weather Sensors</button>
              <button type="button">NMEA 2000 Emitter Cannon</button>
            </section>
            <section class="config-column card" aria-label="Virtual Weather Sensors configuration">
              <div class="card-header">Virtual Weather Sensors</div>
              <div class="card-body"><div id="root"></div></div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <div id="fixture-error" role="alert" hidden></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
